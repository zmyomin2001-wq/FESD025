<!doctype html>
<html lang="en" ng-app="coursePortal">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SE-NCU Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body ng-controller="PortalController as vm">
    <div class="d-flex flex-column min-vh-100">
      <nav class="navbar navbar-expand-md navbar-light prototype-navbar" aria-label="Main navigation">
        <div class="container">
          <a class="navbar-brand fw-bold" href="#!/">SE-NCU Online</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-md-4">
              <li class="nav-item"><a class="nav-link" href="#!/">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#!/manage">Course</a></li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container py-4 flex-grow-1"><div ng-view></div></main>
      <footer class="prototype-footer py-3 text-center small fw-semibold">Software Engineering, North-Chiang Mai University 2025</footer>
    </div>

    <script type="text/ng-template" id="home.html">
      <h1 class="page-title">Highlight</h1>
      <div class="alert alert-success py-2" role="status" ng-if="vm.applicationMessage">{{ vm.applicationMessage }}</div>
      <div class="row g-4 featured-row">
        <div class="col-12 col-md-4" ng-repeat="course in vm.featuredCourses() track by course.courseId">
          <article class="prototype-course-card h-100">
            <div class="prototype-image-box"><img ng-src="{{ course.courseImage }}" alt="{{ course.title }} course cover"></div>
            <div class="prototype-card-title">{{ course.title }}</div>
            <div class="prototype-card-body">
              <p class="course-description">{{ course.description }}</p>
              <p class="mb-3"><strong>Lecturer:</strong> {{ course.lecturer }}</p>
              <div class="d-flex align-items-center justify-content-between gap-2 mt-auto">
                <span><strong>{{ course.duration }}</strong> hours</span>
                <button class="btn btn-sm btn-primary px-3" type="button" ng-click="vm.apply(course)">Apply</button>
              </div>
            </div>
          </article>
        </div>
      </div>
      <div class="text-end mt-4"><a class="btn btn-outline-dark" href="#!/courses">View all courses</a></div>
    </script>

    <script type="text/ng-template" id="courses.html">
      <h1 class="page-title">Courses</h1>
      <div class="alert alert-success py-2" role="status" ng-if="vm.applicationMessage">{{ vm.applicationMessage }}</div>
      <div class="vstack gap-3">
        <article class="prototype-course-row" ng-repeat="course in vm.courses track by course.courseId">
          <div class="course-row-image"><img ng-src="{{ course.courseImage }}" alt="{{ course.title }} course cover"></div>
          <div class="course-row-content">
            <h2>{{ course.title }}</h2>
            <p><strong>Description:</strong> {{ course.description }}</p>
            <p><strong>Lecturer:</strong> {{ course.lecturer }}</p>
            <p><strong>Duration:</strong> {{ course.duration }} hours</p>
            <p><strong>Category:</strong> {{ course.category }}</p>
            <button class="btn btn-sm btn-primary px-4" type="button" ng-click="vm.apply(course)">Apply</button>
          </div>
        </article>
      </div>
    </script>

    <script type="text/ng-template" id="manage.html">
      <h1 class="page-title">Courses Management</h1>
      <div class="management-table-box mb-4">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead><tr><th>ID</th><th>Title</th><th>Lecturer</th><th>Category</th><th>Hours</th><th>Promote</th><th class="text-end">Action</th></tr></thead>
            <tbody>
              <tr ng-repeat="course in vm.courses track by course.courseId">
                <td>{{ course.courseId }}</td><td>{{ course.title }}</td><td>{{ course.lecturer }}</td><td>{{ course.category }}</td><td>{{ course.duration }}</td><td>{{ course.promote ? 'Yes' : 'No' }}</td>
                <td class="text-end text-nowrap"><button class="btn btn-sm btn-dark" type="button" ng-click="vm.edit(course)">Edit</button> <button class="btn btn-sm btn-danger" type="button" ng-click="vm.remove(course.courseId)">Delete</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="alert alert-success py-2" role="status" ng-if="vm.message">{{ vm.message }}</div>
      <form class="prototype-form" name="courseForm" ng-submit="vm.save(courseForm)" novalidate>
        <div class="mb-3"><label class="form-label" for="title">Course title</label><input class="form-control" id="title" name="title" ng-model="vm.form.title" maxlength="100" required></div>
        <div class="mb-3"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" rows="2" maxlength="200" ng-model="vm.form.description" required></textarea></div>
        <div class="mb-3"><label class="form-label" for="lecturer">Lecturer</label><input class="form-control" id="lecturer" name="lecturer" ng-model="vm.form.lecturer" required></div>
        <div class="row g-3 align-items-end">
          <div class="col-sm-6 col-lg-3"><label class="form-label" for="duration">Duration</label><input class="form-control" id="duration" name="duration" type="number" min="1" ng-model="vm.form.duration" required></div>
          <div class="col-sm-6 col-lg-3"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category" ng-model="vm.form.category" ng-options="item for item in vm.categories" required><option value="">Choose...</option></select></div>
          <div class="col-sm-6 col-lg-3"><label class="form-label" for="image">Course image</label><select class="form-select" id="image" name="image" ng-model="vm.form.courseImage" ng-options="image.path as image.label for image in vm.images" required><option value="">Choose...</option></select></div>
          <div class="col-sm-6 col-lg-3"><div class="form-check mb-2"><input class="form-check-input" id="promote" type="checkbox" ng-model="vm.form.promote"><label class="form-check-label" for="promote">Promote</label></div></div>
        </div>
        <div class="d-flex gap-2 mt-3"><button class="btn btn-dark px-4" type="submit">{{ vm.isEditing() ? 'Update' : 'Add' }}</button><button class="btn btn-outline-secondary px-4" type="button" ng-click="vm.closeEditor(courseForm)">Clear</button></div>
      </form>
    </script>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
